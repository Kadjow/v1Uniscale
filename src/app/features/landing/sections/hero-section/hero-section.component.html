<section id="top" class="hero-section">
  <header class="hero-message" appRevealOnScroll>
    <p class="hero-eyebrow">{{ hero().eyebrow }}</p>
    <h1>{{ hero().title }}</h1>
    <p class="hero-description">{{ hero().description }}</p>
    <nav class="hero-actions" aria-label="Ações principais">
      <a class="hero-primary-action" [href]="hero().primaryAction.href">
        {{ hero().primaryAction.label }}
      </a>
      <a class="hero-secondary-action" [href]="hero().secondaryAction.href">
        {{ hero().secondaryAction.label }}
      </a>
    </nav>
  </header>
</section>
