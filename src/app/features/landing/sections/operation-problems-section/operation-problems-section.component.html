<section [id]="section().id" class="operation-problems-section">
  <header class="operation-problems-heading" appRevealOnScroll>
    <p>{{ section().eyebrow }}</p>
    <h2>{{ section().title }}</h2>
    <span>{{ section().description }}</span>
  </header>

  <ul class="operation-friction-board">
    @for (problem of section().cards; track problem.title; let position = $index) {
      <li appRevealOnScroll>
        <article class="operation-friction-card">
          <span class="operation-friction-marker">{{ position + 1 }}</span>
          <h3>{{ problem.title }}</h3>
          <p>{{ problem.description }}</p>
        </article>
      </li>
    }
  </ul>
</section>
