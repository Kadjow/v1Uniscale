<section [id]="section().id" class="strategic-solutions-section">
  <header class="strategic-solutions-heading" appRevealOnScroll>
    <p>{{ section().eyebrow }}</p>
    <h2>{{ section().title }}</h2>
    <span>{{ section().description }}</span>
  </header>

  <ul class="strategic-solution-matrix">
    @for (solution of section().cards; track solution.title) {
      <li appRevealOnScroll>
        <article class="strategic-solution-panel">
          <div class="strategic-solution-content">
            @if (solution.tag) {
              <span class="strategic-solution-tag">{{ solution.tag }}</span>
            }

            <h3>{{ solution.title }}</h3>
            <p>{{ solution.description }}</p>
          </div>
        </article>
      </li>
    }
  </ul>
</section>
